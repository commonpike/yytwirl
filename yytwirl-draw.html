<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    body {
      font-family: sans-serif;
      background-color:black;
      color:white;
      margin:0;
      padding:0;
      min-height:100vh;
      display:flex;
      aside {
        padding:2em;
        background-color:#333;
        flex:1;
        display:flex;
        flex-direction:column;
        button {
          min-width:8em;
          border-radius: 6px;
           padding: .25em;
          background-color: white;
        }
        
        .controls {
          ul {
            list-style-type:none;
            padding: 0 1em;
          }
        }
        footer {
          margin-top:auto;  
          text-align:center;
        }
      }
      main {
        padding:2em;
        flex:3;
        display:flex;
        flex-direction: column;
        #output-container,
        #input-container,
        #canvas-container {
          canvas {
            display:block;
            margin: 0 auto;
          }
        }
        #output-container {
          flex:3;
          margin: 2em 0 4em;
          display:flex;
          canvas {
            border-radius:50%;
            width: auto !important;
            height: auto !important;
          }
          cursor:pointer;
        }
        #input-container,
        #canvas-container {
          flex:1;
          margin-top:auto;
          margin-bottom:2em;
        }
        #input-container {
          cursor:pointer;
        }
      }
    }
    body.drawing {
      #input-container { display: none; }
      #output-container { 
        canvas {
          border:1px solid white; 
        }
      }
    }
    body.random {
      #canvas-container { display: none; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="yytwirl-mapping.js"></script>
  <script>
    
    let redraw = true;
    let debug = false;
    let mapType = 'rectangle';
    let mapSource = 'drawing';
    let mapInput;
    
    const r = 140;
    
    const rectW = 2 * Math.PI * r;
    const rectH = r;
    
    const rectX = 60;
    const rectY = 80;

    // --------------------------------------------------
    // editable trapezium points
    // --------------------------------------------------
    
    let shape = [
      { x: 0, y: 0 },
      { x: rectW/2, y: 0 },
      { x: rectW, y: rectH },
      { x: rectW/2, y: rectH }
    ];
    
    const handleR = 8;
    
    let draggedPoint = -1;
    let inputBuffer;
    let outputBuffer;
    
    function selectMapType(inputElm) {
      mapType = inputElm.value;
      redraw = true;
    }
    function selectMapSource(inputElm) {
      mapSource = inputElm.value;
      document.body.className = mapSource;   // drives the show/hide CSS
      refresh();
    }
    
    function loadRandomImage() {
      // fetch at half the buffer width: the image is drawn once on the
      // left and again mirrored on the right, so the two seams of the
      // wrapped circle (the middle join and the angle wrap-around) match.
      const halfW = ceil(inputBuffer.width / 2);
      loadImage(
        '//picsum.photos/'+halfW+'/'+inputBuffer.height,
        loaded => {
          img = loaded;
          // left half: the image as-is
          inputBuffer.image(
            img, 0, 0,
            halfW, inputBuffer.height, 0, 0,
            img.width, img.height, COVER
          );
          // right half: a horizontal mirror of the left half
          inputBuffer.push();
          inputBuffer.translate(inputBuffer.width, 0);
          inputBuffer.scale(-1, 1);
          inputBuffer.image(
            img, 0, 0,
            halfW, inputBuffer.height, 0, 0,
            img.width, img.height, COVER
          );
          inputBuffer.pop();
          inputBuffer.loadPixels();
          redraw = true;
        }
      );
    }
    
    function refresh() {
      if (mapSource === 'random') {
        loadRandomImage();
      } else {
        redraw = true;
      }
    }

    function getTimestamp() {
      const d = new Date();
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      
      return d.toISOString()
        .slice(0, 16)
        .replace(/[-:T]/g, '')
        .replace(/^(\d{8})(\d{4})$/, '$1-$2');
    }
    
    function exportInput() {
      // saves the image loaded/drawn in the inputBuffer
      saveCanvas(inputBuffer, getTimestamp()+'-yytwirl-input', 'png');
    }
    
    function exportOutput() {
      // saves the outputBuffer
      saveCanvas(outputBuffer, getTimestamp()+'-yytwirl-output', 'png');
    }
    
    // --------------------------------------------------
    
    function setup() {
    
      // main canvas holds only the editing area (frame, shape, handles)
      createCanvas(rectW + 100, rectY + rectH + 40).parent('canvas-container');
      
      // input buffer, either drawn from main canvas drawing or 
      // displaying imported image
      inputBuffer = createGraphics(ceil(rectW), ceil(rectH)).parent('input-container');
      inputBuffer.pixelDensity(1);
      inputBuffer.canvas.style.display = 'block';
      inputBuffer.loadPixels();
      console.log(inputBuffer.pixels.length / (inputBuffer.width * inputBuffer.height));

      // the output circle is its own displayed buffer: shown, redrawn and
      // exported independently. The pixels stay pure (just the disc) so the
      // export is clean; the ring is drawn as a CSS border on the canvas.
      outputBuffer = createGraphics(2 * r, 2 * r).parent('output-container');
      outputBuffer.pixelDensity(1);
      outputBuffer.canvas.style.display = 'block';
      
    }
    
    // --------------------------------------------------
    
    function draw() {
    
      if (redraw) {
        background(245);
      
        drawFrames();
      
        drawRectShape();
        if (mapSource==='drawing') {
          drawBuffer();
        }
        drawScannedShape();
        
        drawHandles();
        redraw = false;
      }
    }
    

    
    // --------------------------------------------------
    // frames
    // --------------------------------------------------
    
    function drawFrames() {
    
      noFill();
      stroke(0);
    
      rect(rectX, rectY, rectW, rectH);
      triangle(rectX, rectY, rectX+rectW, rectY, rectX+rectW/2, rectY+rectH);
    }
    
    // --------------------------------------------------
    // source shape
    // --------------------------------------------------
    
    function drawRectShape() {
    
      fill(0, 40);
      stroke(0);
    
      beginShape();
    
      for (let p of shape) {
        vertex(rectX + p.x, rectY + p.y);
      }
    
      endShape(CLOSE);
    }
    
    // --------------------------------------------------
    // buffer
    // --------------------------------------------------
    
    
    function drawBuffer() {
      inputBuffer.background(255);
    
      inputBuffer.noStroke();
      inputBuffer.fill(0);
    
      inputBuffer.beginShape();
    
      for (let p of shape) {
        inputBuffer.vertex(p.x, p.y);
      }
    
      inputBuffer.endShape(CLOSE);
      inputBuffer.loadPixels();
    }
    
    
    // --------------------------------------------------
    // scanned shape
    // --------------------------------------------------
    
    function drawScannedShape() {
    
      const res = 1;

      // render into the output buffer (origin at its top-left, circle
      // centered at r,r); clear() keeps everything outside the disc
      // transparent so only the circle shows when blitted/exported
      outputBuffer.clear();
      outputBuffer.noStroke();

      for (let cx = -r; cx <= r; cx += res) {
        if (debug) console.info('next line');
        for (let cy = -r; cy <= r; cy += res) {
          let d = Math.sqrt(cx ** 2 + cy ** 2);
          if ( d > r ) continue;
          
          // normalize circle to radius 100
          let abscx = 100*cx/r, abscy = 100*cy/r;
          let {x:absx,y:absy} = mapType === 'triangle' 
            ? mapCirc2Tri(abscx,abscy) 
            : mapCirc2Rect(abscx,abscy);
          // denormalize rect to 2πr x r
          let x = floor(2*Math.PI*r*absx/100), y = floor(r*absy/100);
          
          let idx = 4 * (x + y * inputBuffer.width);
          
          if (x < 0 || x >= inputBuffer.width || y < 0 || y >= inputBuffer.height) {
            if (debug) console.error('out of buffer 1',x,y,inputBuffer.width,inputBuffer.height);
          }
          if (idx > inputBuffer.pixels.length - 2) {
            if (debug) console.error('out of buffer 2',x,y,inputBuffer.pixels.length);
          }
          
          let rr = inputBuffer.pixels[idx];
          let gg = inputBuffer.pixels[idx + 1];
          let bb = inputBuffer.pixels[idx + 2];
    
          if (debug) console.log('pixels',idx,rr,gg,bb);
          outputBuffer.fill(rr, gg, bb);
          outputBuffer.rect(r+cx, r+cy, res, res );
        }
      }
    }
    
    
    // --------------------------------------------------
    // draggable handles
    // --------------------------------------------------
    
    function drawHandles() {
    
      for (let i = 0; i < shape.length; i++) {
    
        let p = shape[i];
    
        fill(255);
        stroke(0);
        strokeWeight(2);
    
        circle(rectX + p.x, rectY + p.y, handleR * 2);
    
        fill(0);
        noStroke();
        textSize(14);
        text(i, rectX + p.x + 10, rectY + p.y - 10);
      }
    }
    
    // --------------------------------------------------
    // mouse interaction
    // --------------------------------------------------
    
    function mousePressed() {
    
      for (let i = 0; i < shape.length; i++) {
    
        let p = shape[i];
    
        let d = dist(
          mouseX,
          mouseY,
          rectX + p.x,
          rectY + p.y
        );
    
        if (d < handleR + 4) {
          draggedPoint = i;
          return;
        }
      }
    }
    
    function mouseDragged() {
    
      if (draggedPoint < 0) return;
    
      let p = shape[draggedPoint];
    
      p.x = constrain(mouseX - rectX, 0, rectW);
      p.y = constrain(mouseY - rectY, 0, rectH);
      redraw = true;
    }
    
    function mouseReleased() {

      draggedPoint = -1;
    }

  </script>

</head>
<body class="drawing">

  <aside>
    <h1>Twirl Mappings</h1>
    
    <div class="controls">
      <h3>MapType</h3>
      <ul>
        <li>
          <label>
            <input type="radio" name="mapType" value="rectangle" checked onChange="selectMapType(this)">rectangle
          </label>
        </li>
        <li>
          <label>
            <input type="radio" name="mapType" value="triangle" onChange="selectMapType(this)">triangle
          </label>
        </li>
      </ul>
      <h3>MapSource</h3>
      <ul>
        <li>
          <label>
            <input type="radio" name="mapSource" value="drawing" checked onChange="selectMapSource(this)">drawing
          </label>
        </li>
        <li>
          <label>
            <input type="radio" name="mapSource" value="random" onChange="selectMapSource(this)">random image
          </label><br>
          <button type="button" onclick="refresh()">Refresh</button>
        </li>
      </ul>
    </div>
    <footer>
      <button id="export-input" type="button" onclick="exportInput()">
        Export input
      </button>
      <button id="export-output" type="button" onclick="exportOutput()">
        Export output
      </button>
    </footer>
  </aside>
  <main>
    <div id="output-container" onclick="exportOutput()" title="export output"></div>
    <div id="input-container" onclick="exportInput()" title="export input"></div>
    <div id="canvas-container"></div>
  </main>

</body>
</html>
